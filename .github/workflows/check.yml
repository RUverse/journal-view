name: Check

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The same rules as Obsidian's plugin review.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
